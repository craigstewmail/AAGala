<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AA Gala Seating Finder</title>

<style>
:root{
    --navy:#07192D;
    --gold:#F5D97F;
    --bg:#f5f7fa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg);
    color:#222;
}

.container{
    max-width:1000px;
    margin:0 auto;
}

.header{
    background:var(--navy);
    border-radius:18px;
    padding:30px;
    text-align:center;
    margin-bottom:24px;
}

.logo{
    max-width:260px;
    width:100%;
    height:auto;
}

h1{
    color:var(--gold);
    margin:15px 0 8px;
}

.subtitle{
    color:white;
}

.search-card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:18px;
    font-size:18px;
    border:3px solid var(--gold);
    border-radius:12px;
}

.results{
    margin-top:24px;
}

.result{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.table-name{
    font-size:28px;
    font-weight:bold;
    color:var(--navy);
}

.guest-name{
    font-size:22px;
    margin-top:10px;
}

.table-guests{
    margin-top:15px;
    border-top:1px solid #ddd;
    padding-top:15px;
}

.table-guests h3{
    margin-top:0;
}

.guest-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:8px;
}

.guest-chip{
    padding:10px;
    background:#eef2f6;
    border-radius:8px;
}

.no-result{
    background:white;
    padding:20px;
    border-radius:16px;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .table-name{
        font-size:22px;
    }

    .guest-name{
        font-size:18px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/craigstewmail/AAGala/refs/heads/main/Gala_Logo.png"
            alt="AA Gala Logo">

        <h1>Find Your Table</h1>

        <div class="subtitle">
            Enter any guest name, organization, or part of a name
        </div>

    </div>

    <div class="search-card">

        <input
            id="search"
            placeholder="Type a name..."
            autocomplete="off">

    </div>

    <div id="results" class="results"></div>

</div>

<script>

const csvData = `
Table,First Name,Last Name
Table 29,Trina,Allen
Table 20,Guest,Barbier
Table 20,Tom,Barbier
Table 17,Jim,Barton
Table 01,Dolores,Bayne
Table 37,Kirsten,Bazylak
Table 37,Lee,Bazylak
Table 22,Brandi,Bell
Table 22,Mike,Bell
Table 19,Joel,Bellerose
Table 19,Mackenzie,Bellerose
Table 01,Charmaine,Berrns
Table 26,Darrell,Bethune
Table 04,Dan,Bourgeois
Table 25,Marty,Bowman
Table 13,Bonnie,Braaten
Table 13,Eric,Braaten
Table 17,Cheryl,Brecht
Table 17,Derek,Brecht
Table 15,Al,Brenner
Table 15,Lindsay,Brenner
Table 07,Sherry,Buchart
Table 08,Nigel,Carmicheal
Table 08,Guest,Carmicheal
Table 05,Hailey,Chase
Table 22,Alana,Churchill
Table 03,Todd,Coburn
Table 02,Janet,Conan
Table 34,Amber,Cook
Table 34,Guest,Cook
Table 24,Justin,Cote
Table 24,Lyneah,Cote
Table 22,Lucy,Craven
Table 24,Craig,Stewart
Table 24,Lisa,Stewart
Table 25,Lisa,Kennedy
Table 39,Kreos Aviation,Kreos Aviation
Table 38,Rise Air,Rise Air
Table 41,Working Staff,Working Staff
Table 42,Western Development Museum (WDM),Western Development Museum (WDM)
`;

const guests = csvData
.trim()
.split("\n")
.slice(1)
.map(line => {
    const parts = line.split(",");
    return {
        table: parts[0].trim(),
        first: parts[1]?.trim() || "",
        last: parts.slice(2).join(",").trim()
    };
});

const searchBox = document.getElementById("search");
const resultsDiv = document.getElementById("results");

searchBox.addEventListener("input", runSearch);

function runSearch(){

    const term = searchBox.value.trim().toLowerCase();

    if(!term){
        resultsDiv.innerHTML = "";
        return;
    }

    const matches = guests.filter(g => {

        const combined =
            `${g.first} ${g.last} ${g.table}`
            .toLowerCase();

        return combined.includes(term);
    });

    if(matches.length === 0){

        resultsDiv.innerHTML =
            '<div class="no-result">No matching guests found.</div>';

        return;
    }

    resultsDiv.innerHTML = matches.map(match => {

        const tableGuests = guests.filter(
            g => g.table === match.table
        );

        return `
        <div class="result">

            <div class="table-name">
                ${match.table}
            </div>

            <div class="guest-name">
                ${match.first} ${match.last}
            </div>

            <div class="table-guests">

                <h3>Everyone at this table</h3>

                <div class="guest-list">

                    ${tableGuests.map(g => `
                        <div class="guest-chip">
                            ${g.first} ${g.last}
                        </div>
                    `).join("")}

                </div>

            </div>

        </div>
        `;

    }).join("");
}

</script>

</body>
</html>
