<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AA Gala Seating Finder</title>

<style>
:root{
    --navy:#07192D;
    --gold:#F5D97F;
    --bg:#f5f7fa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg);
    color:#222;
}

.container{
    max-width:1000px;
    margin:0 auto;
}

.header{
    background:var(--navy);
    border-radius:18px;
    padding:30px;
    text-align:center;
    margin-bottom:24px;
}

.logo{
    max-width:260px;
    width:100%;
    height:auto;
}

h1{
    color:var(--gold);
    margin:15px 0 8px;
}

.subtitle{
    color:white;
    opacity:.9;
}

.search-card{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:18px;
    font-size:18px;
    border:3px solid var(--gold);
    border-radius:12px;
    outline:none;
}

input:focus{
    border-color:#d4b04a;
}

.results{
    margin-top:24px;
}

.result{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.table-name{
    font-size:28px;
    font-weight:bold;
    color:var(--navy);
    margin-bottom:8px;
}

.guest-name{
    font-size:22px;
}

.no-result{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.result-count{
    margin-bottom:15px;
    font-weight:600;
    color:#555;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .header{
        padding:20px;
    }

    .table-name{
        font-size:22px;
    }

    .guest-name{
        font-size:18px;
    }

    input{
        font-size:16px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">

        <img
            class="logo"
            src="https://raw.githubusercontent.com/craigstewmail/AAGala/refs/heads/main/Gala_Logo.png"
            alt="AA Gala Logo">

        <h1>Find Your Table</h1>

        <div class="subtitle">
            Enter all or part of a first name, last name, organization, or table number.
        </div>

    </div>

    <div class="search-card">

        <input
            id="search"
            type="text"
            placeholder="Start typing a guest name..."
            autocomplete="off">

    </div>

    <div class="results">

        <div id="count" class="result-count"></div>

        <div id="results"></div>

    </div>

</div>

<script>

const csvData = `
Table,First Name,Last Name
Table 29,Trina,Allen
Table 20,Guest,Barbier
Table 20,Tom,Barbier
Table 17,Jim,Barton
Table 01,Dolores,Bayne
Table 37,Kirsten,Bazylak
Table 37,Lee,Bazylak
Table 22,Brandi,Bell
Table 22,Mike,Bell
Table 19,Joel,Bellerose
Table 19,Mackenzie,Bellerose
Table 24,Craig,Stewart
Table 24,Lisa,Stewart
Table 25,Lisa,Kennedy

/* PASTE THE REMAINDER OF YOUR CSV HERE */
`;

const guests = csvData
.trim()
.split('\n')
.slice(1)
.filter(line => line.trim() !== '')
.map(line => {

    const parts = line.split(',');

    return {
        table: parts[0]?.trim() || '',
        first: parts[1]?.trim() || '',
        last: parts.slice(2).join(',').trim()
    };
});

const searchInput = document.getElementById('search');
const resultsDiv = document.getElementById('results');
const countDiv = document.getElementById('count');

searchInput.addEventListener('input', searchGuests);

function searchGuests(){

    const term = searchInput.value.trim().toLowerCase();

    if(!term){
        resultsDiv.innerHTML = '';
        countDiv.textContent = '';
        return;
    }

    const matches = guests.filter(g => {

        const searchable =
            `${g.table} ${g.first} ${g.last}`
            .toLowerCase();

        return searchable.includes(term);

    });

    countDiv.textContent =
        `${matches.length} matching guest${matches.length === 1 ? '' : 's'}`;

    if(matches.length === 0){

        resultsDiv.innerHTML = `
            <div class="no-result">
                No matching guests found.
            </div>
        `;

        return;
    }

    resultsDiv.innerHTML = matches.map(g => `
        <div class="result">

            <div class="table-name">
                ${g.table}
            </div>

            <div class="guest-name">
                ${g.first} ${g.last}
            </div>

        </div>
    `).join('');
}

</script>

</body>
</html>
