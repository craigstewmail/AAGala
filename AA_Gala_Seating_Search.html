:root{
    --navy:#07192D;
    --gold:#F5D97F;
    --bg:#f5f7fa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;

    background:var(--bg);
    color:#222;
}

.container{

}

.header{

    margin-bottom:24px;
}


h1{

}

.subtitle{
    color:white;
    opacity:.9;
}

.search-card{

    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

input{

}

input:focus{

}

.results{
    margin-top:24px;
}

.result{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.table-name{

    font-weight:bold;
    color:var(--navy);
    margin-bottom:8px;
}

.guest-name{
    font-size:22px;
}

.no-result{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.result-count{
    margin-bottom:15px;
    font-weight:600;
    color:#555;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .header{
        padding:20px;
    }

    .table-name{
        font-size:22px;
    }

    .guest-name{
        font-size:18px;
    }

    input{
        font-size:16px;
    }
}
</style>

const guests = csvData
.trim()
.split('\n')
.slice(1)
.filter(line => line.trim() !== '')
.map(line => {

    const parts = line.split(',');

    return {
        table: parts[0]?.trim() || '',
        first: parts[1]?.trim() || '',
        last: parts.slice(2).join(',').trim()
    };
});

const searchInput = document.getElementById('search');
const resultsDiv = document.getElementById('results');
const countDiv = document.getElementById('count');

searchInput.addEventListener('input', searchGuests);

function searchGuests(){

    const term = searchInput.value.trim().toLowerCase();

    if(!term){
        resultsDiv.innerHTML = '';
        countDiv.textContent = '';
        return;
    }

    const matches = guests.filter(g => {

        const searchable =
            `${g.table} ${g.first} ${g.last}`
            .toLowerCase();

        return searchable.includes(term);

    });

    countDiv.textContent =
        `${matches.length} matching guest${matches.length === 1 ? '' : 's'}`;

    if(matches.length === 0){

        resultsDiv.innerHTML = `
            <div class="no-result">
                No matching guests found.
            </div>
        `;

        return;
    }

    resultsDiv.innerHTML = matches.map(g => `
        <div class="result">

            <div class="table-name">
                ${g.table}
            </div>

            <div class="guest-name">
                ${g.first} ${g.last}
            </div>

        </div>
    `).join('');
}
